name: Release

# Push a tag like v0.1.0 to build Windock and publish it as a GitHub Release.
# CONTRIBUTING.md ("Making a release") has the steps before tagging.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml and CHANGELOG.md
        id: version
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($cargo -ne $version) {
            Write-Error "Tag $tag doesn't match version $cargo in Cargo.toml"
            exit 1
          }
          # The release notes are this version's section of the changelog.
          $notes = @()
          $inside = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## \[') {
              if ($inside) { break }
              $inside = $line -match "^## \[$([regex]::Escape($version))\]"
              continue
            }
            if ($inside -and $line -notmatch '^\[[^\]]+\]:\s') { $notes += $line }
          }
          if (-not ($notes -join '').Trim()) {
            Write-Error "CHANGELOG.md has no '## [$version]' section with notes"
            exit 1
          }
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8 release-notes.md
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      # Release mode: in debug builds, three raster tests trip a debug assertion inside egui.
      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory dist, stage | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/windock.exe dist/
          Copy-Item dist/windock.exe, LICENSE, README.md, CHANGELOG.md stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/windock-$version-windows-x64.zip"
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @()
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $flags += '--prerelease' }
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist -File).FullName `
            --verify-tag --title 'Windock ${{ steps.version.outputs.version }}' `
            --notes-file release-notes.md @flags
