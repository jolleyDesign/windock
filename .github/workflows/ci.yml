name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Format, clippy, build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      # Release mode: in debug builds, three raster tests trip a debug assertion inside egui.
      - name: Test
        run: cargo test --release

      - uses: actions/upload-artifact@v7
        with:
          name: windock-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/windock.exe
          if-no-files-found: error
